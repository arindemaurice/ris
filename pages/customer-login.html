<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - RIS</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, .12);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0 0 7px;
        }

        .brand p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: .92;
        }

        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .info-box {
            margin-top: 22px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 9px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="brand">

            <div class="brand-logo">
                RIS
            </div>

            <h1>Customer Portal</h1>

            <p>
                Sign in to manage your internet account
            </p>

        </div>


        <div
            id="errorMessage"
            class="error-message"
        ></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

        </form>


        <div class="info-box">
            Use the username and password created for your
            customer account by the RIS administrator.
        </div>


        <a
            href="../index.html"
            class="back-link"
        >
            ← Back to RIS Administration
        </a>

    </div>

</div>


<script>

const CUSTOMER_KEY = "RIS_customers";
const SESSION_KEY = "RIS_customer_session";


function getCustomers() {

    try {

        return JSON.parse(
            localStorage.getItem(CUSTOMER_KEY)
        ) || [];

    } catch (error) {

        return [];

    }

}


function showError(message) {

    const box =
        document.getElementById("errorMessage");

    box.textContent = message;

    box.style.display = "block";

}


function hideError() {

    document.getElementById("errorMessage")
        .style.display = "none";

}


/* =========================
   LOGIN
========================= */

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    hideError();


    const username =
        document.getElementById("username")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;


    const customers =
        getCustomers();


    if (customers.length === 0) {

        showError(
            "No customer accounts exist yet. Please ask the administrator to create your account."
        );

        return;
    }


    const customer =
        customers.find(c =>
            String(c.username || "")
                .toLowerCase() === username.toLowerCase()
            &&
            String(c.password || "") === password
        );


    if (!customer) {

        showError(
            "Invalid username or password."
        );

        return;
    }


    /*
       Store only the customer ID
       as the current browser session.
    */

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            customerId: customer.id,
            loginTime: new Date().toISOString()
        })
    );


    window.location.href =
        "customer-portal.html";

});


/* =========================
   IF ALREADY LOGGED IN
========================= */

if (localStorage.getItem(SESSION_KEY)) {

    window.location.href =
        "customer-portal.html";

}

</script>

</body>
</html>
